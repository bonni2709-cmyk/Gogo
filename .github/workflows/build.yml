name: Verify and package Lumen Tube
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test -p lumen-core -p lumen-proxy -p lumen-youtube -p lumen-player
      - run: cargo clippy -p lumen-core -p lumen-proxy -p lumen-youtube -p lumen-player --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-and-lockfile
          path: |
            Cargo.lock
            crates/*/src/*.rs
          if-no-files-found: error
  ui-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Type-check shared Slint UI
        shell: bash
        run: cargo check -p lumen-ui 2>&1 | tee ui.log
      - name: Publish UI compiler diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f ui.log ]; then
            text=$(tail -c 6000 ui.log)
            text="${text//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::$text"
          fi
  windows:
    needs: core-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - shell: bash
        run: cargo build --release -p lumen-desktop --target x86_64-pc-windows-msvc 2>&1 | tee build.log
      - name: Publish compiler diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            text=$(tail -c 6000 build.log)
            text="${text//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::$text"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-tube-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/lumen-desktop.exe
            Cargo.lock
          if-no-files-found: error
  android:
    defaults:
      run:
        shell: bash
    needs: core-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # Hosted Ubuntu 24.04 already includes the Android SDK and sdkmanager.
      - name: Install Android SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" 2>&1 | tee sdk.log
      - run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Cross-compile Rust library through cargo-ndk
        run: cargo ndk -t arm64-v8a -p 26 build -p lumen-android --release 2>&1 | tee build.log
      # Debug packaging supplies a CI debug signature. This is NOT a release-signed APK.
      - name: Package installable preview APK
        run: cargo apk build -p lumen-android --target aarch64-linux-android 2>&1 | tee build.log
      - name: Publish Android compiler diagnostics
        if: failure()
        run: |
          for log in sdk.log build.log; do
            if [ ! -f "$log" ]; then continue; fi
            text=$(tail -c 6000 "$log")
            text="${text//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::$text"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-tube-android-arm64-preview
          path: |
            target/debug/apk/*.apk
            Cargo.lock
          if-no-files-found: error
