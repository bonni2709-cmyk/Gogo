name: Android runtime smoke
on:
  push:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/android-smoke.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK and build tooling
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build Rust for emulator
        id: rust
        run: cargo ndk -t x86_64 -p 26 -o android/app/src/main/jniLibs build -p lumen-android --release 2>&1 | tee rust.log
      - name: Generate synthetic offline video (test dependency only)
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          mkdir -p android/app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc=size=320x180:rate=24' \
            -f lavfi -i 'sine=frequency=440:sample_rate=44100' -t 12 \
            -c:v libx264 -pix_fmt yuv420p -profile:v baseline -c:a aac -movflags +faststart \
            android/app/src/androidTest/assets/fixture.mp4
      - name: Compile instrumentation APKs
        id: compile
        working-directory: android
        run: gradle --no-daemon -PlumenAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee ../gradle-smoke.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/run-smoke.sh
      - name: Expose failure diagnostics
        if: failure()
        run: |
          for log in rust.log gradle-smoke.log; do
            if [ "$log" = rust.log ] && [ "${{ steps.rust.outcome }}" != failure ]; then continue; fi
            if [ "$log" = gradle-smoke.log ] && [ "${{ steps.compile.outcome }}" != failure ]; then continue; fi
            if [ ! -f "$log" ]; then continue; fi
            text=$(tail -c 2800 "$log")
            text="${text//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::$text"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            instrumentation.log
            emulator-logcat.txt
          if-no-files-found: warn
